<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Endoscopy Reports</title><style>:root{--nav:#123047;--blue:#087ea4;--green:#237b53;--red:#b33a3a;--bg:#f4f7fa;--line:#dce4e9;--text:#183044;--muted:#6d7d88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.shell{display:flex;min-height:100vh}.side{width:225px;background:var(--nav);color:white;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{padding:5px 12px 24px;border-bottom:1px solid #ffffff22}.brand b{font-size:22px}.brand small{display:block;color:#b8c9d3;margin-top:5px}.side button{width:100%;border:0;background:transparent;color:#dbe7ed;text-align:left;padding:12px;border-radius:8px;margin-top:8px;cursor:pointer}.side button:hover{background:#ffffff14}.main{margin-left:225px;flex:1;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted)}.btn{border:0;border-radius:7px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.light{background:#e8eef2;color:#233b4a}.btn.green{background:var(--green);color:#fff}.btn.red{background:#f9e8e8;color:#9b2d2d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:6px}.card{padding:18px;margin-top:16px}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px}.filters input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd7de;border-radius:7px}.tablewrap{overflow:auto;margin-top:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8ec;text-align:left;white-space:nowrap}.badge{padding:4px 8px;border-radius:20px;background:#e7f4eb;color:#246d43}.draft{background:#fff2d8;color:#825f18}.empty{text-align:center;padding:30px;color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap}.notice{margin-top:12px;padding:10px;border-radius:7px;background:#edf8fb}@media(max-width:800px){.side{width:65px}.brand b,.brand small,.side button span{display:none}.main{margin-left:65px;padding:13px}.filters,.stats{grid-template-columns:1fr 1fr}.top{display:block}}@media(max-width:550px){.stats,.filters{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>IGMCRI</b><small>Endoscopy Suite</small></div><button onclick="location.href='endoscopy.html'">▣ <span>New Report</span></button><button onclick="location.reload()">▤ <span>Dashboard</span></button><button onclick="location.href='qr-generator.html'">▦ <span>QR Generator</span></button></aside><main class="main"><div class="top"><div><h1>Endoscopy Report Register</h1><p class="muted">Stored reports • View • Edit • Print A4 • Digital photographs</p></div><div><button class="btn" onclick="location.href='endoscopy.html'">+ New Report</button><button class="btn green" onclick="location.href='qr-generator.html'">QR Generator</button></div></div><div class="stats"><div class="stat"><small>Total reports</small><strong id="total">—</strong></div><div class="stat"><small>Today</small><strong id="today">—</strong></div><div class="stat"><small>Draft</small><strong id="draft">—</strong></div><div class="stat"><small>Finalized</small><strong id="final">—</strong></div></div><div class="card"><div class="filters"><input id="search" placeholder="Search patient, UHID or report number" oninput="load()"><input id="date" type="date" onchange="load()"></div><div id="notice" class="notice" style="display:none"></div><div id="out" class="tablewrap">Loading…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb'),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));async function load(){let q=db.from('endoscopy_reports').select('id,report_no,patient_name,patient_id,procedure_date,status,access_token').order('procedure_date',{ascending:false}).order('report_no',{ascending:false}).limit(500);const date=$('date').value;if(date)q=q.eq('procedure_date',date);const r=await q;if(r.error){$('out').innerHTML='<div class="empty">Unable to load reports: '+esc(r.error.message)+'</div>';return}let a=r.data||[],today=new Date().toISOString().slice(0,10);$('total').textContent=a.length;$('today').textContent=a.filter(x=>x.procedure_date===today).length;$('draft').textContent=a.filter(x=>x.status==='draft').length;$('final').textContent=a.filter(x=>x.status==='final').length;const s=$('search').value.trim().toLowerCase();if(s)a=a.filter(x=>[x.report_no,x.patient_name,x.patient_id].join(' ').toLowerCase().includes(s));if(!a.length){$('out').innerHTML='<div class="empty">No reports found.</div>';return}$('out').innerHTML='<table class="table"><thead><tr><th>Report No</th><th>Patient</th><th>UHID</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+a.map(x=>`<tr><td><b>${esc(x.report_no||x.id.slice(0,8))}</b></td><td>${esc(x.patient_name)}</td><td>${esc(x.patient_id)}</td><td>${esc(x.procedure_date)}</td><td><span class="badge ${x.status==='draft'?'draft':''}">${esc(x.status)}</span></td><td class="actions"><button class="btn" onclick="view('${x.id}')">View</button><button class="btn light" onclick="editReport('${x.id}')">Edit</button><button class="btn light" onclick="printNow('${x.id}')">Print A4</button><button class="btn green" onclick="qrReport('${x.id}','${x.access_token||''}')">QR</button><button class="btn red" onclick="deleteReport('${x.id}','${x.report_no||''}')">Delete</button></td></tr>`).join('')+'</tbody></table>'}function view(id){location.href='endoscopy-viewer.html?id='+encodeURIComponent(id)}function editReport(id){location.href='endoscopy.html?edit='+encodeURIComponent(id)}function printNow(id){const w=window.open('endoscopy-viewer.html?id='+encodeURIComponent(id)+'&autoprint=1','_blank');if(!w)alert('Please allow pop-ups for this site.')}function qrReport(id,token){location.href='qr-generator.html?reportId='+encodeURIComponent(id)+(token?'&token='+encodeURIComponent(token):'')}async function deleteReport(id,reportNo){if(!confirm('Delete report '+(reportNo||id)+' and its stored photographs? This cannot be undone.'))return;const notice=$('notice');notice.style.display='block';notice.textContent='Deleting report…';try{const p=await db.from('endoscopy_photos').select('storage_path').eq('report_id',id);if(p.error)throw p.error;const paths=(p.data||[]).map(x=>x.storage_path);if(paths.length){const s=await db.storage.from('endoscopy-photos').remove(paths);if(s.error)throw s.error;const d=await db.from('endoscopy_photos').delete().eq('report_id',id);if(d.error)throw d.error}const r=await db.from('endoscopy_reports').delete().eq('id',id);if(r.error)throw r.error;notice.textContent='Report deleted successfully.';await load()}catch(e){notice.textContent='Delete failed: '+(e.message||e)}}load();</script></body></html>
