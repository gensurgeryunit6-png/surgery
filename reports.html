<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Endoscopy Reports</title><style>body{margin:0;background:#f4f7fa;color:#183044;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #dce4e9;border-radius:12px;padding:18px;margin-top:15px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd7de;border-radius:7px}button{border:0;border-radius:7px;padding:9px 13px;background:#087ea4;color:#fff;font-weight:700;cursor:pointer;margin-right:5px}.light{background:#e8eef2;color:#233b4a}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8ec;text-align:left;white-space:nowrap}.badge{padding:4px 8px;border-radius:20px;background:#e7f4eb;color:#246d43}.draft{background:#fff2d8;color:#825f18}.muted{color:#6d7d88}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{display:block}}</style></head><body><div class="wrap"><div class="head"><div><h1>IGMCRI Endoscopy Reports</h1><p class="muted">Report register • View • Print A4</p></div><div><button onclick="location.href='endoscopy.html'">+ New Report</button></div></div><div class="card"><div class="grid"><input id="search" placeholder="Search patient, UHID or report number" oninput="load()"><input id="date" type="date" onchange="load()"></div><div id="out" class="tablewrap" style="margin-top:16px">Loading…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb');const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));async function load(){let q=db.from('endoscopy_reports').select('id,report_no,patient_name,patient_id,procedure_date,status,access_token').order('procedure_date',{ascending:false}).order('report_no',{ascending:false}).limit(200);const date=document.getElementById('date').value;if(date)q=q.eq('procedure_date',date);const r=await q;if(r.error){out.innerHTML='<p>Unable to load reports: '+esc(r.error.message)+'</p>';return}let a=r.data||[];const s=document.getElementById('search').value.trim().toLowerCase();if(s)a=a.filter(x=>[x.report_no,x.patient_name,x.patient_id].join(' ').toLowerCase().includes(s));if(!a.length){out.innerHTML='<p class="muted">No reports found.</p>';return}out.innerHTML='<table class="table"><thead><tr><th>Report No</th><th>Patient</th><th>UHID</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.report_no)}</td><td>${esc(x.patient_name)}</td><td>${esc(x.patient_id)}</td><td>${esc(x.procedure_date)}</td><td><span class="badge ${x.status==='draft'?'draft':''}">${esc(x.status)}</span></td><td><button onclick="openReport('${x.id}')">View</button><button class="light" onclick="printReport('${x.id}')">Print A4</button></td></tr>`).join('')+'</tbody></table>'}function openReport(id){location.href='endoscopy-viewer.html?id='+encodeURIComponent(id)}function printReport(id){const w=window.open('endoscopy-viewer.html?id='+encodeURIComponent(id),'_blank');if(w)w.focus()}load();</script></body></html>
