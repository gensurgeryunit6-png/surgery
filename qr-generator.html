<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | QR Code Generator</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#f4f7fa;color:#183044;font:14px Arial}.wrap{max-width:760px;margin:35px auto;padding:18px}.card{background:#fff;border:1px solid #dce4e9;border-radius:14px;padding:24px;box-shadow:0 3px 12px #0001}h1{text-align:center;margin:0 0 5px}.sub{text-align:center;color:#6d7d88;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd7de;border-radius:7px}button{border:0;border-radius:7px;padding:11px 16px;background:#087ea4;color:#fff;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.light{background:#e8eef2;color:#233b4a}.qr{margin:25px auto 10px;width:220px;min-height:220px;display:flex;align-items:center;justify-content:center;border:1px dashed #b9cbd3;padding:15px;background:#fff}.preview{text-align:center;color:#6d7d88;word-break:break-all}.error{color:#a22;margin-top:10px}.info{background:#edf8fb;border-radius:8px;padding:12px;margin-top:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.card{box-shadow:none;border:0}.no-print{display:none}.qr{border:0}}</style></head><body><div class="wrap"><div class="card"><h1>IGMCRI</h1><div class="sub">Endoscopy Digital Photograph QR Generator</div><div class="grid no-print"><div><label>Report ID</label><input id="reportId" placeholder="Paste report UUID"></div><div><label>QR Token</label><input id="token" placeholder="Paste access token"></div></div><div class="info no-print">The QR code opens <b>only the digital endoscopy photographs</b>. The clinical report is not displayed through this QR.</div><div class="no-print" style="text-align:center;margin-top:10px"><button onclick="generate()">Generate QR Code</button><button class="light" onclick="window.print()">Print QR</button><button class="light" onclick="downloadQR()">Download QR</button><button class="light" onclick="location.href='reports.html'">Back to Reports</button></div><div id="qr" class="qr"><span class="preview">QR code will appear here</span></div><div id="url" class="preview"></div></div></div><script>const base=location.origin+location.pathname.replace('qr-generator.html','endoscopy-photos.html');let lastUrl='';const params=new URLSearchParams(location.search);document.getElementById('reportId').value=params.get('reportId')||'';document.getElementById('token').value=params.get('token')||'';if(params.get('reportId')||params.get('token'))generate();function generate(){const id=document.getElementById('reportId').value.trim(),token=document.getElementById('token').value.trim();if(!id&&!token){document.getElementById('url').innerHTML='<span class="error">Enter Report ID or QR Token.</span>';return}lastUrl=token?base+'?token='+encodeURIComponent(token):base+'?id='+encodeURIComponent(id);document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:lastUrl,width:210,height:210,correctLevel:QRCode.CorrectLevel.M});document.getElementById('url').textContent='QR destination: digital photographs only'}function downloadQR(){if(!lastUrl){generate();if(!lastUrl)return}const canvas=document.querySelector('#qr canvas');const img=document.querySelector('#qr img');const a=document.createElement('a');a.download='IGMCRI-Endoscopy-Photos-QR.png';a.href=canvas?canvas.toDataURL('image/png'):img.src;a.click()}</script></body></html>
