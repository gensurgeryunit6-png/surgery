<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Colonoscopy Report</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182b38;font:13px Arial}.toolbar{position:sticky;top:0;background:#123047;color:#fff;padding:11px;display:flex;justify-content:center;gap:8px;z-index:5}.toolbar button{border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer;background:#087ea4;color:#fff}.toolbar .light{background:#fff;color:#123047}.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:13mm 14mm;box-shadow:0 2px 14px #0002}.head{text-align:center;border-bottom:2px solid #123047;padding-bottom:9px;margin-bottom:12px}.head h1{margin:0;font-size:20px}.head h2{margin:3px 0;font-size:15px}.head p{margin:3px;color:#60727e}.patient{display:grid;grid-template-columns:1fr 1fr;border:1px solid #bcc8cf}.patient div{padding:6px 8px;border-bottom:1px solid #dce3e7}.patient div:nth-child(odd){border-right:1px solid #dce3e7}.label{font-size:10px;color:#60727e;display:block}.value{font-weight:700}.section{margin-top:12px}.section h3{font-size:13px;background:#edf4f7;border-left:4px solid #087ea4;padding:6px;margin:0 0 6px}.box{border:1px solid #d8e0e4;padding:8px}.findingline{padding:4px 0;border-bottom:1px dashed #dfe5e8}.findingline:last-child{border-bottom:0}.text{white-space:pre-wrap;line-height:1.45}.signature{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:38px}.sign{border-top:1px solid #333;padding-top:6px;text-align:center}.qrrow{display:flex;justify-content:flex-end;margin-top:15px}.qrbox{display:flex;align-items:center;gap:12px;border:1px dashed #9eb4bf;padding:8px;width:245px}.qrbox img{width:72px;height:72px}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:11mm 13mm}@page{size:A4;margin:0}}@media(max-width:800px){.page{width:auto;min-height:0;margin:0;padding:18px}.patient{grid-template-columns:1fr}.patient div:nth-child(odd){border-right:0}.qrrow{justify-content:center}}</style></head><body><div class="toolbar"><button onclick="window.print()">Print A4 Report</button><button class="light" onclick="location.href='reports.html'">Back to Reports</button></div><main class="page" id="report">Loading report…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb'),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));const j=x=>x&&typeof x==='object'?x:{};function row(k,v){return v!==''&&v!=null?'<div class="findingline"><b>'+esc(k)+':</b> '+esc(v)+'</div>':''}function section(title,rows){return '<div class="section"><h3>'+esc(title)+'</h3><div class="box">'+rows+'</div></div>'}function objRows(o,skip=[]){return Object.entries(j(o)).filter(([k,v])=>!skip.includes(k)&&v!==''&&v!=null&&typeof v!=='object').map(([k,v])=>row(k.replaceAll('_',' '),v)).join('')}function lines(s){return String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map((x,i)=>(i+1)+'. '+esc(x)).join('<br>')}async function run(){const p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token');if(!id&&!token){$('report').textContent='No report identifier supplied.';return}let q=db.from('endoscopy_reports').select('*,faculty(name,designation)');q=token?q.eq('access_token',token):q.eq('id',id);const r=await q.maybeSingle();if(r.error||!r.data){$('report').textContent='Report could not be loaded.';return}const d=r.data,a=j(d.assessment),v=j(d.interventions),an=j(v.anorectum),re=j(v.rectum),si=j(v.sigmoid),de=j(v.descending),tr=j(v.transverse),as=j(v.ascending),ce=j(v.cecum),ti=j(v.terminal_ileum);const polys=Array.isArray(a.polyps)?a.polyps:[];const photoUrl=location.origin+location.pathname.replace('colonoscopy-viewer.html','endoscopy-photos.html')+'?token='+encodeURIComponent(d.access_token||'');$('report').innerHTML='<div class="head"><h1>INDIRA GANDHI MEDICAL COLLEGE & RESEARCH INSTITUTE</h1><h2>DEPARTMENT OF SURGERY</h2><p>Colonoscopy Report</p></div><div class="patient">'+[['Report No',d.report_no],['Unit',a.unit],['Name',d.patient_name],['Age/Sex',(d.age??'')+' / '+(d.gender||'')],['Date',d.procedure_date],['UHID / Patient ID',d.patient_id],['Indication',d.indication],['Endoscopist',d.faculty?.name||''],['Bowel preparation',a.bowel_preparation],['Boston Bowel Prep Score',a.bbps],['Depth of insertion',a.depth_of_insertion],['Withdrawal time',a.withdrawal_time?(a.withdrawal_time+' minutes'):'']].map(x=>'<div><span class="label">'+esc(x[0])+'</span><span class="value">'+esc(x[1]||'—')+'</span></div>').join('')+'</div>'+section('Anorectum / Anal canal',objRows(an,['notes'])+row('Additional findings',an.notes))+section('Rectum',objRows(re,['notes'])+row('Additional findings',re.notes))+section('Sigmoid colon',objRows(si,['notes'])+row('Additional findings',si.notes))+section('Descending colon',objRows(de,['notes'])+row('Additional findings',de.notes))+section('Transverse colon',objRows(tr,['notes'])+row('Additional findings',tr.notes))+section('Ascending colon',objRows(as,['notes'])+row('Additional findings',as.notes))+section('Cecum',objRows(ce,['notes'])+row('Additional findings',ce.notes))+section('Terminal ileum',objRows(ti,['notes'])+row('Additional findings',ti.notes))+(polys.length?section('Polyp details',polys.map((p,i)=>'<div class="findingline"><b>Polyp '+(i+1)+':</b> '+esc([p.location,p.size_mm?p.size_mm+' mm':'',p.morphology,p.paris_class,p.resection_method,p.retrieved?'retrieved':'not retrieved'].filter(Boolean).join(' • '))+'</div>').join('')):'')+section('Interventions & complications',objRows(v,['anorectum','rectum','sigmoid','descending','transverse','ascending','cecum','terminal_ileum','a'])+objRows(a,['unit','bbps','bowel_preparation','depth_of_insertion','withdrawal_time','impression','recommendations','polyps']))+'<div class="section"><h3>Final impression</h3><div class="box text">'+(lines(a.impression)||'Not recorded')+'</div></div><div class="section"><h3>Recommendations</h3><div class="box text">'+(lines(a.recommendations)||'Not recorded')+'</div></div><div class="qrrow"><div class="qrbox"><div id="qr"></div><div><b>Digital photographs</b><br><small>Scan QR to view photographs only.</small></div></div></div><div class="signature"><div class="sign">Endoscopist<br><b>'+esc(d.faculty?.name||'')+'</b></div><div class="sign">Department of Surgery<br>IGMCRI</div></div>';new QRCode($('qr'),{text:photoUrl,width:72,height:72});if(p.get('autoprint')==='1')setTimeout(()=>window.print(),700)}run();</script></body></html>
