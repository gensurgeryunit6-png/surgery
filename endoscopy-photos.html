<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Endoscopy Photographs</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#183044;font:14px Arial}.wrap{max-width:1200px;margin:0 auto;padding:22px}.head{background:#fff;border:1px solid #dce4e9;border-radius:12px;padding:20px;text-align:center}.head h1{margin:0;font-size:22px}.head p{margin:6px;color:#6d7d88}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.photo{background:#fff;border:1px solid #dce4e9;border-radius:10px;padding:10px}.photo img{display:block;width:100%;height:300px;object-fit:contain;background:#f7f9fa;border-radius:7px}.caption{text-align:center;padding:9px 4px 2px;font-weight:700}.error,.empty{background:#fff;border:1px solid #e5c4c4;border-radius:10px;padding:18px;margin-top:18px}.empty{border-color:#dce4e9;text-align:center;color:#6d7d88}@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:10px}.gallery{grid-template-columns:1fr}.photo img{height:260px}}@media print{body{background:#fff}.wrap{padding:8mm}.head{border:0}.gallery{grid-template-columns:repeat(2,1fr)}.photo{break-inside:avoid}.photo img{height:105mm}}</style></head><body><main class="wrap"><section class="head"><h1>IGMCRI – Endoscopy Photographs</h1><p id="info">Loading photographs…</p></section><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb'),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));async function run(){const p=new URLSearchParams(location.search),token=p.get('token'),id=p.get('id');if(!token&&!id){$('out').innerHTML='<div class="error">No report QR identifier was supplied.</div>';return}let q=db.from('endoscopy_reports').select('id,report_no,patient_name,patient_id,access_token');q=token?q.eq('access_token',token):q.eq('id',id);const r=await q.maybeSingle();if(r.error||!r.data){$('out').innerHTML='<div class="error">Digital photographs could not be loaded.</div>';return}const d=r.data;$('info').textContent='Report '+(d.report_no||'')+' • Digital photographs';const pr=await db.from('endoscopy_photos').select('storage_path,caption,sequence_no').eq('report_id',d.id).order('sequence_no');if(pr.error){$('out').innerHTML='<div class="error">Photo records could not be loaded: '+esc(pr.error.message)+'</div>';return}const rows=pr.data||[];if(!rows.length){$('out').innerHTML='<div class="empty">No digital photographs have been uploaded for this report.</div>';return}const gallery=document.createElement('div');gallery.className='gallery';for(let i=0;i<rows.length;i++){const x=rows[i];const s=await db.storage.from('endoscopy-photos').createSignedUrl(x.storage_path,86400);const url=s.data?.signedUrl||'';const card=document.createElement('div');card.className='photo';if(url){card.innerHTML='<img loading="lazy" src="'+esc(url)+'" alt="Endoscopy photograph '+(i+1)+'"><div class="caption">Photo '+(i+1)+(x.caption?' – '+esc(x.caption):'')+'</div>'}else{card.innerHTML='<div class="error">Photo '+(i+1)+' could not be loaded.</div><div class="caption">'+(x.caption?esc(x.caption):'Endoscopy photograph')+'</div>'}gallery.appendChild(card)}$('out').appendChild(gallery)}run();</script></body></html>
