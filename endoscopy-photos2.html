<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endoscopy Photographs</title><style>body{margin:0;background:#f3f7fa;color:#173247;font:15px Arial}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d8e3e9;border-radius:12px;padding:15px;margin-bottom:14px}.card img{width:100%;max-height:75vh;object-fit:contain;background:#f5f7f8;border-radius:8px}.cap{font-size:17px;font-weight:bold;text-align:center;padding:10px}.muted{color:#687a84}</style></head><body><main class="wrap"><div class="card"><h2>IGMCRI Endoscopy Photographs</h2><p class="muted" id="info">Loading photographs…</p></div><div id="photos"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb');const token=new URLSearchParams(location.search).get('token');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){if(!token){info.textContent='Invalid QR code.';return}const r=await db.from('endoscopy_reports').select('id,patient_name,report_no').eq('access_token',token).single();if(r.error){info.textContent='Report not found or QR access has expired.';return}info.textContent=(r.data.report_no||'Report')+' • '+(r.data.patient_name||'Patient');const p=await db.from('endoscopy_photos').select('storage_path,caption,sequence_no').eq('report_id',r.data.id).order('sequence_no');if(p.error){info.textContent='Unable to load photographs: '+p.error.message;return}if(!p.data?.length){photos.innerHTML='<div class="card">No photographs were stored for this report.</div>';return}photos.innerHTML=p.data.map((x,i)=>{const u=db.storage.from('endoscopy-photos').getPublicUrl(x.storage_path).data.publicUrl;return '<div class="card"><img src="'+esc(u)+'" alt="Endoscopy photograph '+(i+1)+'"><div class="cap">Photo '+(i+1)+(x.caption?' — '+esc(x.caption):'')+'</div></div>'}).join('')}run();</script></body></html>
