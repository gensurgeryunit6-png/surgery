<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Upper GI Endoscopy Report</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182b38;font:13px Arial}.toolbar{position:sticky;top:0;background:#123047;color:#fff;padding:11px;display:flex;justify-content:center;gap:8px;z-index:5}.toolbar button{border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer;background:#087ea4;color:#fff}.toolbar .light{background:#fff;color:#123047}.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:13mm 14mm;box-shadow:0 2px 14px #0002}.head{text-align:center;border-bottom:2px solid #123047;padding-bottom:9px;margin-bottom:12px}.head h1{margin:0;font-size:20px}.head h2{margin:3px 0;font-size:15px}.head p{margin:3px;color:#60727e}.patient{display:grid;grid-template-columns:1fr 1fr;border:1px solid #bcc8cf}.patient div{padding:6px 8px;border-bottom:1px solid #dce3e7}.patient div:nth-child(odd){border-right:1px solid #dce3e7}.label{font-size:10px;color:#60727e;display:block}.value{font-weight:700}.section{margin-top:12px}.section h3{font-size:13px;background:#edf4f7;border-left:4px solid #087ea4;padding:6px;margin:0 0 6px}.box{border:1px solid #d8e0e4;padding:8px}.findingline{padding:4px 0;border-bottom:1px dashed #dfe5e8}.findingline:last-child{border-bottom:0}.text{white-space:pre-wrap;line-height:1.45}.signature{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:38px}.sign{border-top:1px solid #333;padding-top:6px;text-align:center}.qrrow{display:flex;justify-content:flex-end;margin-top:15px}.qrbox{display:flex;align-items:center;gap:12px;border:1px dashed #9eb4bf;padding:8px;width:245px}.qrbox img{width:72px;height:72px}.error{padding:20px;background:#fff0f0;color:#8c2424;border:1px solid #efc0c0;border-radius:8px}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:11mm 13mm}@page{size:A4;margin:0}}@media(max-width:800px){.page{width:auto;min-height:0;margin:0;padding:18px}.patient{grid-template-columns:1fr}.patient div:nth-child(odd){border-right:0}.qrrow{justify-content:center}}</style></head><body><div class="toolbar"><button onclick="window.print()">Print A4 Report</button><button class="light" onclick="location.href='reports.html'">Back to Reports</button></div><main class="page" id="report">Loading report…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb'),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));const j=x=>x&&typeof x==='object'?x:{};function row(k,v){return v!==''&&v!=null?'<div class="findingline"><b>'+esc(k)+':</b> '+esc(v)+'</div>':''}function section(title,rows){return '<div class="section"><h3>'+esc(title)+'</h3><div class="box">'+rows+'</div></div>'}function lines(s){return String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map((x,i)=>(i+1)+'. '+esc(x)).join('<br>')}async function run(){const p=new URLSearchParams(location.search),token=p.get('token'),id=p.get('id');if(!token&&!id){$('report').innerHTML='<div class="error">No report identifier was supplied.</div>';return}let q=db.from('endoscopy_reports').select('*,faculty(name,designation)');q=token?q.eq('access_token',token):q.eq('id',id);const r=await q.maybeSingle();if(r.error||!r.data){$('report').innerHTML='<div class="error">Report could not be loaded: '+esc(r.error?.message||'Not found')+'</div>';return}const d=r.data,l=j(d.larynx),e=j(d.esophagus),s=j(d.stomach),du=j(d.duodenum),iv=j(d.interventions),a=j(d.assessment);const qr=location.origin+location.pathname.replace('endoscopy-viewer.html','endoscopy-photos.html')+'?token='+encodeURIComponent(d.access_token||'');$('report').innerHTML='<div class="head"><h1>INDIRA GANDHI MEDICAL COLLEGE & RESEARCH INSTITUTE</h1><h2>DEPARTMENT OF SURGERY</h2><p>Upper GI Endoscopy Report</p></div><div class="patient">'+[['Report No',d.report_no],['Unit',a.unit],['Name',d.patient_name],['Age/Sex',(d.age??'')+' / '+(d.gender||'')],['Date',d.procedure_date],['UHID / Patient ID',d.patient_id],['Indication',d.indication],['Endoscopist',d.faculty?.name||''],['Sedation',d.sedation_type]].map(x=>'<div><span class="label">'+esc(x[0])+'</span><span class="value">'+esc(x[1]||'—')+'</span></div>').join('')+'</div>'+section('Hypopharynx / Larynx (Vocal Cords)',row('Vocal cords',l.vocal_cords)+row('Mobility',l.mobility)+row('Lesion / nodule / polyp',l.lesion)+row('Edema / erythema',l.edema_erythema)+row('Symmetric movement',l.symmetric_movement)+row('Additional findings',l.notes))+section('Esophagus',row('GE junction distance',e.ge_junction_distance)+row('Hiatus',e.hiatus+(e.hiatal_hernia_size?' – '+e.hiatal_hernia_size+' cm':''))+row('Z-line',e.z_line+(e.z_line_displacement?' – '+e.z_line_displacement+' cm':''))+row('Mucosa',e.mucosa)+row('Esophagitis (LA grade)',e.esophagitis_la_grade)+row("Barrett's esophagus",e.barretts+(e.barretts_length?' – '+e.barretts_length+' cm':''))+row('Varices',e.varices)+row('Stricture / ring',e.stricture_ring+(e.stricture_detail?' – '+e.stricture_detail:''))+row('Mass / polyp',e.mass_polyp+(e.mass_polyp_detail?' – '+e.mass_polyp_detail:''))+row('Biopsy taken',e.biopsy_taken+(e.biopsy_detail?' – '+e.biopsy_detail:''))+row('Additional findings',e.notes))+section('Stomach (Body / Corpus)',row('Mucosa',s.mucosa)+row('Gastritis',s.gastritis)+row('Ulcer',s.ulcer+(s.ulcer_detail?' – '+s.ulcer_detail:''))+row('Polyp / mass',s.polyp_mass+(s.polyp_mass_detail?' – '+s.polyp_mass_detail:''))+row('Portal hypertensive gastropathy',s.portal_hypertensive_gastropathy)+row('Food residue',s.food_residue)+row('Biopsy taken',s.biopsy_taken+(s.biopsy_detail?' – '+s.biopsy_detail:''))+row('H. pylori (if tested)',s.h_pylori)+row('Antrum',s.antrum)+row('Additional findings',s.notes))+section('Duodenum',row('Duodenal bulb',du.duodenal_bulb)+row('2nd part (D2)',du.d2)+row('Ulcer',du.ulcer+(du.ulcer_detail?' – '+du.ulcer_detail:''))+row('Villous pattern',du.villous_pattern)+row('Stenosis / narrowing',du.stenosis_narrowing)+row('Mass / polyp',du.mass_polyp)+row('Biopsy taken',du.biopsy_taken+(du.biopsy_detail?' – '+du.biopsy_detail:''))+row('Additional findings',du.notes))+section('Intervention & complications',row('Biopsy',iv.biopsy)+row('Biopsy site',iv.biopsy_site)+row('Number of samples',iv.biopsy_number)+row('Hemostasis',iv.hemostasis)+row('Polypectomy',iv.polypectomy)+row('Complication',iv.complication))+'<div class="section"><h3>Final impression</h3><div class="box text">'+(lines(a.impression)||'Not recorded')+'</div></div><div class="section"><h3>Recommendations</h3><div class="box text">'+(lines(a.recommendations)||'Not recorded')+'</div></div><div class="qrrow"><div class="qrbox"><div id="qr"></div><div><b>Digital photographs</b><br><small>Scan QR to view photographs only.</small></div></div></div><div class="signature"><div class="sign">Endoscopist<br><b>'+esc(d.faculty?.name||'')+'</b></div><div class="sign">Department of Surgery<br>IGMCRI</div></div>';new QRCode($('qr'),{text:qr,width:72,height:72});if(p.get('autoprint')==='1')setTimeout(()=>window.print(),700)}run();</script></body></html>
