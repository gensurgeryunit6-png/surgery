<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Endoscopy Digital Report</title><style>body{font-family:Arial;margin:0;background:#f4f7fa;color:#17324d}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:20px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}.photo{max-width:100%;height:auto;border-radius:8px}h1{margin-bottom:4px}pre{white-space:pre-wrap;font:15px Arial;line-height:1.5}</style></head><body><div class="wrap"><div class="card"><h1>IGMCRI</h1><h2>Upper GI Endoscopy — Digital Report</h2><div id="out">Loading...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dtbpchspeirxvojfozld.supabase.co','sb_publishable_wy0O6mXoSZR2lDOQRikNpg_kaXvI8nb');const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function run(){const token=new URLSearchParams(location.search).get('token');if(!token){out.textContent='Invalid report link';return}const r=await db.from('endoscopy_reports').select('*,faculty(name,designation)').eq('access_token',token).eq('status','final').single();if(r.error){out.textContent='Report unavailable';return}const d=r.data;out.innerHTML=`<p><b>Report No:</b> ${d.report_no}</p><p><b>Patient:</b> ${esc(d.patient_name)} &nbsp; <b>ID:</b> ${esc(d.patient_id)}</p><p><b>Date:</b> ${esc(d.procedure_date)}</p><p><b>Endoscopist:</b> ${esc(d.faculty?.name||'')}</p><hr><pre>${esc(d.report_text||'')}</pre><h3>Endoscopy Photographs</h3><div id="photos">Loading photographs...</div>`;const p=await db.from('endoscopy_photos').select('*').eq('report_id',d.id).order('sequence_no');if(p.error){photos.textContent='Photographs unavailable';return}if(!p.data.length){photos.textContent='No photographs attached.';return}photos.innerHTML='';for(const x of p.data){const s=await db.storage.from('endoscopy-photos').createSignedUrl(x.storage_path,300);if(!s.error)photos.innerHTML+=`<div class="card"><img class="photo" src="${s.data.signedUrl}"><p>${esc(x.caption||'Endoscopy photograph')}</p></div>`}}run();</script></body></html>
