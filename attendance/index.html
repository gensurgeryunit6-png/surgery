<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IGMCRI Teacher Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f9;color:#123047}
header{background:#102a43;color:#fff;padding:18px 24px;font-size:20px;font-weight:800}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:#fff;border:1px solid #d9e4e9;border-radius:18px;padding:20px;box-shadow:0 8px 28px #102a4310}
label{display:block;font-weight:700;margin-top:10px}
input{width:100%;padding:13px;border:1px solid #c9d6dc;border-radius:10px;margin:6px 0 10px;font-size:16px;box-sizing:border-box}
button{padding:13px 18px;border:0;border-radius:10px;background:#087f8c;color:#fff;font-weight:800;cursor:pointer;margin:4px}
.danger{background:#b53a3a}.muted{color:#667985;font-size:13px}
.qr{min-height:440px;border:2px dashed #cad9df;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.timer{position:absolute;right:14px;top:14px;padding:8px 12px;border-radius:20px;background:#102a43;color:#fff;font-weight:800}
.bigcount{text-align:center;font-size:32px;font-weight:900}.hidden{display:none}
.row{padding:9px 0;border-bottom:1px solid #edf0f2}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>IGMCRI · Teacher Attendance Console</header>
<div class="wrap">
<div class="grid">
<div>
<div class="card">
<h2>Start Class</h2>
<label>Class</label>
<input id="title" placeholder="PG Seminar / Case Presentation">
<label>Batch Number</label>
<input id="batch" placeholder="2024">
<label>Teacher</label>
<input id="teacher" placeholder="Teacher name">
<button id="start">Start Session</button>
<button id="end" class="danger hidden">End Session</button>
<div id="sessionPanel" class="hidden">
<button id="reveal" style="width:100%">Reveal 4-Digit Code to Teacher</button>
<div id="codeWrap" class="hidden">
<div class="muted">TEACHER ONLY — SAY THIS CODE ORALLY</div>
<div id="code" style="font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;padding:14px">----</div>
<div class="muted">Do not display this code on the projector.</div>
</div>
</div>
</div>
<div class="card" style="margin-top:18px">
<div class="bigcount"><span id="count">0</span></div>
<div style="text-align:center">students marked present</div>
<div id="list" class="muted">No active session.</div>
</div>
</div>
<div class="card">
<h2>Live Dynamic QR</h2>
<div class="qr"><div id="qr"></div><div id="timer" class="timer">OFF</div></div>
<p class="muted" style="text-align:center">This QR always opens the Student Attendance page. It changes every 5 seconds.</p>
</div>
</div>
</div>
<script>
(function(){
const U=window.SUPABASE_URL||'REPLACE_SUPABASE_URL';
const K=window.SUPABASE_PUBLISHABLE_KEY||'REPLACE_SUPABASE_PUBLISHABLE_KEY';
const REG='https://gensurgeryunit6-png.github.io/surgery/attendance/register.html';
let session=null;
let secret=null;
let qrTimer=null;
let listTimer=null;

function $(id){return document.getElementById(id);}

async function api(fn,body){
 const response=await fetch(U+'/functions/v1/'+fn,{
  method:'POST',
  headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K},
  body:JSON.stringify(body||{})
 });
 const text=await response.text();
 let data;
 try{data=JSON.parse(text);}catch(e){throw new Error('Server response error: '+text.slice(0,120));}
 if(!response.ok)throw new Error(data.error||'Request failed');
 return data;
}

async function sha(value){
 const bytes=new TextEncoder().encode(value);
 const hash=await crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(hash)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}

async function drawQR(){
 if(!session||!secret)return;
 const bucket=Math.floor(Date.now()/5000);
 const token=(await sha(session.id+'.'+bucket+'.'+secret)).slice(0,32);
 const url=REG+'?session_id='+encodeURIComponent(session.id)+'&bucket='+bucket+'&token='+token;
 $('qr').innerHTML='';
 new QRCode($('qr'),{text:url,width:390,height:390,colorDark:'#102a43',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
 $('timer').textContent=(5-(Math.floor(Date.now()/1000)%5))+'s';
}

async function loadAttendance(){
 if(!session)return;
 try{
  const data=await api('attendance-list',{session_id:session.id});
  $('count').textContent=data.count||0;
  $('list').innerHTML=(data.rows&&data.rows.length)
   ? data.rows.map(function(x){return '<div class="row"><b>'+x.name+'</b> · '+x.regno+' · '+new Date(x.marked_at).toLocaleTimeString()+'</div>';}).join('')
   : 'No students yet.';
 }catch(e){}
}

$('start').onclick=async function(){
 try{
  const batch=$('batch').value.trim();
  if(!batch)throw new Error('Enter batch number');
  session=await api('attendance-session',{
   action:'start',
   title:$('title').value||'Class Session',
   batch:batch,
   teacher:$('teacher').value||'Teacher'
  });
  secret=session.qr_secret;
  $('code').textContent=session.session_code;
  $('sessionPanel').classList.remove('hidden');
  $('start').classList.add('hidden');
  $('end').classList.remove('hidden');
  await drawQR();
  qrTimer=setInterval(drawQR,5000);
  listTimer=setInterval(loadAttendance,3000);
 }catch(e){alert(e.message);}
};

$('reveal').onclick=function(){
 $('codeWrap').classList.remove('hidden');
 $('reveal').textContent='Code Revealed — Tell Students Orally';
};

$('end').onclick=async function(){
 try{
  await api('attendance-session',{action:'end',session_id:session.id});
  clearInterval(qrTimer);
  clearInterval(listTimer);
  session=null;
  secret=null;
  $('qr').innerHTML='';
  $('timer').textContent='ENDED';
  $('start').classList.remove('hidden');
  $('end').classList.add('hidden');
  $('sessionPanel').classList.add('hidden');
  $('codeWrap').classList.add('hidden');
 }catch(e){alert(e.message);}
};

setInterval(function(){
 if(session)$('timer').textContent=(5-(Math.floor(Date.now()/1000)%5))+'s';
},1000);
})();
</script>
</body>
</html>
