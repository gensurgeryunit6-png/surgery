<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Attendance</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f7fa;color:#173047}header{padding:18px 22px;background:#102a43;color:#fff}.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.c{background:#fff;border:1px solid #dce5ea;border-radius:16px;padding:20px;box-shadow:0 8px 30px #102a4312}input,select{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 12px;border:1px solid #cbd7de;border-radius:9px}button{padding:12px 16px;border:0;border-radius:9px;background:#087f8c;color:#fff;font-weight:800;margin-right:8px;cursor:pointer}.danger{background:#b53a3a}.qr{min-height:340px;display:flex;justify-content:center;align-items:center;border:1px dashed #c6d3d9;border-radius:12px;position:relative}.timer{position:absolute;right:10px;top:10px;background:#edf8f9;color:#087f8c;padding:6px 9px;border-radius:999px;font-weight:800}.muted{color:#687b8b;font-size:13px}.hidden{display:none}@media(max-width:800px){.g{grid-template-columns:1fr}}</style></head><body><header><b>IGMCRI · Smart Class Attendance</b></header><div class="wrap"><div class="g"><div class="c"><h2>Teacher Console</h2><div class="muted">Each QR token is valid for one 10-second interval.</div><label>Class</label><input id="title" placeholder="PG Seminar · Abdominal Tuberculosis"><label>Batch Number</label><input id="batch" placeholder="2024" inputmode="numeric"><label>Teacher</label><input id="teacher" placeholder="Teacher name"><button id="start">Start Session</button><button id="end" class="danger hidden">End Session</button><div id="info" class="muted" style="margin-top:14px"></div><div id="codebox" class="muted" style="margin-top:12px;font-size:22px;font-weight:800;display:none">Class Code: <span id="code"></span></div></div><div class="c"><h2>Live QR</h2><div class="qr"><div id="qr"></div><div id="timer" class="timer">Not running</div></div><div class="muted" style="text-align:center;margin-top:10px">Students scan from their phones.</div></div></div><div class="c" style="margin-top:16px"><h2>Live attendance: <span id="count">0</span></h2><div id="list" class="muted">Start a session.</div></div></div><script>const U=window.SUPABASE_URL||'REPLACE_SUPABASE_URL',K=window.SUPABASE_PUBLISHABLE_KEY||'REPLACE_SUPABASE_PUBLISHABLE_KEY';let s=null,t=null,p=null;const $=x=>document.getElementById(x);async function api(fn,body){const r=await fetch(U+'/functions/v1/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function qr(){if(!s)return;const b=Math.floor(Date.now()/10000);const j=await api('attendance-qr',{session_id:s.id,bucket:b});$('qr').innerHTML='';new QRCode($('qr'),{text:j.url,width:290,height:290,colorDark:'#102a43',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});$('timer').textContent=(10-(Math.floor(Date.now()/1000)%10))+'s'}async function load(){if(!s)return;try{const j=await api('attendance-list',{session_id:s.id});$('count').textContent=j.count;$('list').innerHTML=j.rows.length?j.rows.map(x=>'<div style="padding:9px 0;border-bottom:1px solid #eee"><b>'+x.name+'</b> · '+x.batch+' · '+new Date(x.marked_at).toLocaleTimeString()+'</div>').join(''):'No students registered yet.'}catch(e){}}$('start').onclick=async()=>{try{s=await api('attendance-session',{action:'start',title:$('title').value||'Class Session',batch:$('batch').value.trim(),teacher:$('teacher').value||'Teacher'});$('code').textContent=s.session_code;$('codebox').style.display='block';$('start').classList.add('hidden');$('end').classList.remove('hidden');$('info').textContent='Session ID: '+s.id;await qr();t=setInterval(qr,10000);p=setInterval(load,3000)}catch(e){alert(e.message)}};$('end').onclick=async()=>{try{await api('attendance-session',{action:'end',session_id:s.id});clearInterval(t);clearInterval(p);s=null;$('start').classList.remove('hidden');$('end').classList.add('hidden');$('timer').textContent='Ended';$('codebox').style.display='none'}catch(e){alert(e.message)}};setInterval(()=>{if(s)$('timer').textContent=(10-(Math.floor(Date.now()/1000)%10))+'s'},1000)</script></body></html>
