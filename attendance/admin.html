<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Attendance Admin</title><script src="config.js"></script><style>body{font-family:Arial;background:#f4f7fa;color:#173047;margin:0}.w{max-width:1000px;margin:24px auto;padding:16px}.c{background:#fff;border:1px solid #dce5ea;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px #102a4312}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,button{padding:12px;border-radius:9px;border:1px solid #cbd7de;box-sizing:border-box}input{width:100%;margin:5px 0 10px}button{background:#087f8c;color:#fff;border:0;font-weight:800;cursor:pointer}.danger{background:#b53a3a}.msg{padding:12px;border-radius:9px;background:#f2f7f8;margin:10px 0}.ok{background:#eaf8f0}.err{background:#fff1f1}.row{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>IGMCRI Attendance · Admin</h1><div class="c"><h2>Admin Access</h2><input id="key" type="password" placeholder="Admin key"><button id="login">Open Admin Console</button><div id="msg" class="msg">Enter the admin key.</div></div><div id="panel" class="hidden"><div class="c"><h2>Enroll Student</h2><div class="g"><div><label>Name</label><input id="name"></div><div><label>Register / Roll No.</label><input id="regno"></div><div><label>Batch Number</label><input id="batch" placeholder="2024"></div></div><button id="enroll">Enroll / Regenerate Personal OTP</button><div id="otp" class="msg"></div></div><div class="c"><h2>Enrolled Students</h2><div id="list">Loading…</div></div></div></div><script>const U=window.SUPABASE_URL,K=window.SUPABASE_PUBLISHABLE_KEY,$=x=>document.getElementById(x);let key='';async function api(body){const r=await fetch(U+'/functions/v1/attendance-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({...body,password:key})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){const j=await api({action:'list'});$('list').innerHTML=j.rows.length?j.rows.map(x=>'<div class="row"><b>'+x.name+'</b> · '+x.regno+' · Batch '+x.batch+' · '+(x.active?'Active':'Inactive')+'</div>').join(''):'No students enrolled.'}$('login').onclick=async()=>{key=$('key').value;try{await api({action:'login'});$('panel').classList.remove('hidden');$('msg').textContent='Admin access granted.';$('msg').className='msg ok';await load()}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}};$('enroll').onclick=async()=>{try{const j=await api({action:'enroll',name:$('name').value,regno:$('regno').value,batch:$('batch').value});$('otp').textContent='Personal OTP for '+j.name+' ('+j.regno+'): '+j.personal_otp+' — give this only to the student.';$('otp').className='msg ok';await load()}catch(e){$('otp').textContent=e.message;$('otp').className='msg err'}};</script></body></html>
