<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Face Enrollment Admin</title><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f7f9;color:#123047}.wrap{max-width:1050px;margin:24px auto;padding:16px}.grid{display:grid;grid-template-columns:420px 1fr;gap:18px}.card{background:#fff;border:1px solid #d9e4e9;border-radius:18px;padding:20px;box-shadow:0 8px 28px #102a4310}input{width:100%;padding:13px;border:1px solid #c9d6dc;border-radius:10px;margin:6px 0 12px}button{padding:13px 18px;border:0;border-radius:10px;background:#087f8c;color:#fff;font-weight:800;cursor:pointer;width:100%}.cam{background:#101820;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:10px 0}.cam video{width:100%;height:100%;object-fit:cover}.msg{padding:12px;border-radius:10px;background:#eef4f6;margin:10px 0}.ok{background:#e9f8ef}.err{background:#fff0f0}.row{padding:11px 0;border-bottom:1px solid #edf0f2}.muted{font-size:13px;color:#667985}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>IGMCRI · Face Enrollment Admin</h1><div class="grid"><div class="card"><h2>Register Student</h2><label>Name</label><input id="name" placeholder="Student name"><label>Register / Roll Number</label><input id="regno"><label>Batch Number</label><input id="batch" placeholder="2024"><div class="cam"><video id="video" autoplay muted playsinline></video></div><div id="modelmsg" class="muted">Loading face verification models…</div><button id="enroll" disabled>Capture Face & Enroll Student</button><div id="msg" class="msg">One clear face must be visible.</div></div><div class="card"><h2>Enrolled Students</h2><button id="refresh" style="margin-bottom:12px">Refresh List</button><div id="list">Loading…</div></div></div></div>
<script>
const U=window.SUPABASE_URL||'REPLACE_SUPABASE_URL',K=window.SUPABASE_PUBLISHABLE_KEY||'REPLACE_SUPABASE_PUBLISHABLE_KEY',$=x=>document.getElementById(x);let stream=null,ready=false;
async function api(body){const r=await fetch(U+'/functions/v1/attendance-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const j=await api({action:'list'});$('list').innerHTML=j.rows.length?j.rows.map(x=>'<div class="row"><b>'+x.name+'</b><br>'+x.regno+' · Batch '+x.batch+' · '+(x.active?'Active':'Inactive')+'</div>').join(''):'No students enrolled.'}catch(e){$('list').textContent=e.message}}
async function init(){try{const base='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';await faceapi.nets.tinyFaceDetector.loadFromUri(base);await faceapi.nets.faceLandmark68Net.loadFromUri(base);await faceapi.nets.faceRecognitionNet.loadFromUri(base);ready=true;$('modelmsg').textContent='Face models ready.';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;$('enroll').disabled=false;await load()}catch(e){$('modelmsg').textContent=e.message;$('modelmsg').className='muted err'}}
$('enroll').onclick=async()=>{try{if(!$('name').value.trim()||!$('regno').value.trim()||!$('batch').value.trim())throw Error('Name, register number and batch are required');$('msg').textContent='Detecting face…';const d=await faceapi.detectSingleFace($('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!d)throw Error('No clear face detected');const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;c.getContext('2d').drawImage($('video'),0,0);const j=await api({action:'enroll',name:$('name').value.trim(),regno:$('regno').value.trim(),batch:$('batch').value.trim(),face_descriptor:Array.from(d.descriptor),face_image:c.toDataURL('image/jpeg',.85)});$('msg').textContent='Enrolled '+j.name+' successfully.';$('msg').className='msg ok';await load()}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}};
$('refresh').onclick=load;init();
</script></body></html>
