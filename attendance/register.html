<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Student Attendance</title><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f7f9;color:#123047}.wrap{max-width:540px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #d9e4e9;border-radius:18px;padding:22px;box-shadow:0 8px 28px #102a4310}input{width:100%;padding:14px;border:1px solid #c9d6dc;border-radius:10px;margin:8px 0 14px;font-size:18px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#087f8c;color:#fff;font-weight:800;font-size:16px}.cam{background:#101820;border-radius:14px;overflow:hidden;margin:12px 0;aspect-ratio:4/3}.cam video{width:100%;height:100%;object-fit:cover}.msg{padding:12px;border-radius:10px;background:#eef4f6;margin:12px 0}.ok{background:#e9f8ef}.err{background:#fff0f0}.hidden{display:none}.loader{font-size:13px;color:#667985}
</style></head><body><div class="wrap"><div class="card"><h2>IGMCRI · Class Attendance</h2><div id="status" class="msg">Checking QR…</div><div id="gate"><label>Teacher's 4-digit Session Code</label><input id="code" inputmode="numeric" maxlength="4" placeholder="••••"><button id="open">Open Attendance</button></div><div id="attendance" class="hidden"><label>Register / Roll Number</label><input id="regno" autocomplete="off"><div class="loader" id="models">Loading face verification…</div><div class="cam"><video id="video" autoplay muted playsinline></video></div><button id="mark" disabled>Verify Face & Mark Attendance</button><div id="result" class="msg">Look directly at the camera.</div></div></div></div>
<script>
const U=(window.SUPABASE_URL||'REPLACE_SUPABASE_URL'),K=(window.SUPABASE_PUBLISHABLE_KEY||'REPLACE_SUPABASE_PUBLISHABLE_KEY'),P=new URLSearchParams(location.search),sid=P.get('session_id'),bucket=P.get('bucket'),token=P.get('token'),$=x=>document.getElementById(x);let stream=null,modelsReady=false;
async function api(fn,body){const r=await fetch(U+'/functions/v1/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function sha(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){if(!sid||!bucket||!token){$('status').textContent='Invalid QR. Scan the current classroom QR.';$('status').className='msg err';return}try{const s=await api('attendance-session',{action:'validate',session_id:sid});$('status').textContent=s.title+' · Batch '+s.batch;$('status').className='msg ok'}catch(e){$('status').textContent=e.message;$('status').className='msg err'}}
async function loadModels(){const base='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';await faceapi.nets.tinyFaceDetector.loadFromUri(base);await faceapi.nets.faceLandmark68Net.loadFromUri(base);await faceapi.nets.faceRecognitionNet.loadFromUri(base);modelsReady=true;$('models').textContent='Face verification ready.';$('models').className='loader ok'}
$('open').onclick=async()=>{try{const v=await api('attendance-session',{action:'verify_code',session_id:sid,session_code:$('code').value.trim()});$('gate').classList.add('hidden');$('attendance').classList.remove('hidden');$('status').textContent=v.title+' · Batch '+v.batch+' · Session verified';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;await loadModels();$('mark').disabled=false}catch(e){$('status').textContent=e.message;$('status').className='msg err'}};
$('mark').onclick=async()=>{if(!modelsReady)return;const reg=$('regno').value.trim();if(!reg){alert('Enter register number');return}$('mark').disabled=true;$('result').textContent='Looking for one face…';try{const det=await faceapi.detectSingleFace($('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!det)throw Error('No clear face detected. Face the camera and try again.');const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;c.getContext('2d').drawImage($('video'),0,0);const r=await api('attendance-register',{session_id:sid,bucket,token,session_code:$('code').value.trim(),regno:reg,face_descriptor:Array.from(det.descriptor),face_image:c.toDataURL('image/jpeg',.82)});$('result').textContent='Attendance recorded for '+r.name+' · '+new Date(r.marked_at).toLocaleTimeString();$('result').className='msg ok';if(stream)stream.getTracks().forEach(x=>x.stop())}catch(e){$('result').textContent=e.message;$('result').className='msg err';$('mark').disabled=false}};
init();
</script></body></html>
