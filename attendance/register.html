<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Attendance</title><style>body{font-family:Arial;background:#f4f7fa;color:#173047}.w{max-width:520px;margin:25px auto;padding:15px}.c{background:#fff;padding:22px;border-radius:16px;border:1px solid #dce5ea}input,select{width:100%;padding:12px;box-sizing:border-box;margin:7px 0 12px;border:1px solid #cbd7de;border-radius:9px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#087f8c;color:white;font-weight:800}.cam{background:#111820;border-radius:12px;overflow:hidden;aspect-ratio:4/3}.cam video{width:100%;height:100%;object-fit:cover}.msg{padding:12px;border-radius:9px;background:#f2f7f8;margin:12px 0}.ok{background:#eaf8f0}.err{background:#fff1f1}</style></head><body><div class="w"><div class="c"><h2>Class Attendance</h2><div id="session" class="msg">Validating QR…</div><label>Register / Roll No.</label><input id="regno"><label>Personal OTP</label><input id="personalcode" inputmode="numeric" maxlength="6"><label>Class Session Code</label><input id="classcode" inputmode="numeric" maxlength="6"><label>Batch Number</label><input id="batch" placeholder="2024" inputmode="numeric"><label>Face capture</label><div class="cam"><video id="video" autoplay muted playsinline></video></div><button id="go" disabled>Capture & Mark Present</button><div id="msg" class="msg">Camera access is required.</div></div></div><script src="config.js"></script><script>const U=window.SUPABASE_URL||'REPLACE_SUPABASE_URL',K=window.SUPABASE_PUBLISHABLE_KEY||'REPLACE_SUPABASE_PUBLISHABLE_KEY',P=new URLSearchParams(location.search),sid=P.get('session_id'),bucket=P.get('bucket'),nonce=P.get('nonce'),$=x=>document.getElementById(x);let stream=null;async function api(fn,body){const r=await fetch(U+'/functions/v1/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function init(){try{const s=await api('attendance-session',{action:'validate',session_id:sid,bucket,nonce});$('session').textContent=s.title+' · '+'Batch '+s.batch+' · '+s.teacher;$('session').className='msg ok';const v=await api('attendance-session',{action:'student_verify',session_id:sid,class_code:$('classcode').value,regno:$('regno').value,personal_otp:$('personalcode').value});$('name').value=v.name;$('batch').value=v.batch;$('session').textContent='Verified: '+v.name+' · Batch '+v.batch;$('session').className='msg ok';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;$('go').disabled=false}catch(e){$('session').textContent=e.message;$('session').className='msg err'}}$('go').onclick=async()=>{const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;c.getContext('2d').drawImage($('video'),0,0);$('go').disabled=true;$('msg').textContent='Submitting…';try{const r=await api('attendance-register',{session_id:sid,bucket,nonce,name:$('name').value.trim(),regno:$('regno').value.trim(),batch:$('batch').value.trim(),face_image:c.toDataURL('image/jpeg',.78)});$('msg').textContent='Present recorded for '+r.name+' · '+new Date(r.marked_at).toLocaleTimeString();$('msg').className='msg ok';if(stream)stream.getTracks().forEach(x=>x.stop())}catch(e){$('msg').textContent=e.message;$('msg').className='msg err';$('go').disabled=false}};init()</script></body></html>
