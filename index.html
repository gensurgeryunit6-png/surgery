<body>
<div id="app"><div class="login card"><h1>IGMCRI Surgery</h1><p class="muted">Loading application…</p></div></div>
<script src="config.js?v=20260817-v4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('error',function(e){
  const a=document.getElementById('app');
  if(a && (!a.querySelector('.top') && !a.querySelector('form'))){
    a.innerHTML='<div class="login card"><h1>IGMCRI Surgery</h1><p class="muted">Application could not load.</p><p style="color:#b42318">'+String(e.message||'Please refresh the page.')+'</p><button onclick="location.reload()">Reload</button></div>';
  }
});
</script>
<script src="app.js?v=20260817-v4"></script>
<script src="login-override.js?v=20260817-v4"></script>

</html>
