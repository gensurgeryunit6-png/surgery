<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI | Dressing Room Entry</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f6f8;color:#153c50;font:15px/1.5 "Segoe UI",Arial,sans-serif}header{background:#103e55;color:white;padding:20px max(18px,calc((100vw - 1000px)/2))}header small{color:#b6e0e7;font-weight:700;letter-spacing:.09em}h1{margin:5px 0 0;font-size:24px}main{max-width:1000px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid #d6e5ea;border-radius:15px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px #123d5110}h2{margin:0 0 10px;font-size:18px}.muted{color:#637f8d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-size:13px;font-weight:700}input,select,textarea{width:100%;margin-top:5px;border:1px solid #c7dbe3;border-radius:8px;padding:11px;font:inherit;color:#153c50;background:#fff}textarea{min-height:88px;resize:vertical}.wide{grid-column:1/-1}button,.btn{border:0;background:#087d90;color:#fff;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none}.secondary{background:#e7f3f6;color:#16566c}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:17px}.notice{padding:10px 0;font-size:13px;min-height:22px}.error{color:#b42318}.ok{color:#0d7663}.hide{display:none!important}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:870px}th,td{border-bottom:1px solid #dce8ed;padding:9px;text-align:left;vertical-align:top}th{background:#f1f8fa}nav a{color:#0a748b}nav{margin:0 0 16px;font-size:13px}.filter{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.filter label{min-width:160px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}.card{padding:15px}h1{font-size:20px}}@media print{header,nav,.no-print,#auth{display:none!important}body{background:#fff}.card{box-shadow:none;border:0;padding:0}main{margin:0;max-width:none}}</style></head><body><header><small>IGMCRI · DEPARTMENT OF GENERAL SURGERY</small><h1>Dressing Room — Patient Entry</h1></header><main><div id="app"><section class="card"><h2>New dressing entry</h2><p class="muted">Date and time are recorded automatically when you submit the form. No login is required.</p><form id="form" class="grid"><label class="wide">Patient name *<input name="patient_name" required maxlength="150" autocomplete="off"></label><label>Age *<input name="age" type="number" min="0" max="120" required></label><label>Sex *<select name="sex" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Unit *<select name="unit" required><option value="">Select unit</option><option>Unit 1</option><option>Unit 2</option><option>Unit 3</option><option>Unit 4</option><option>Unit 5</option><option>Unit 6</option></select></label><label>Ward *<select id="ward" name="ward" required><option value="">Select ward</option><option value="FSW">FSW — Female Surgery Ward</option><option value="MSW">MSW — Male Surgery Ward</option></select></label><label>Postgraduate name *<select name="pg_name" id="pg" required><option value="">Select postgraduate</option><option value="__other__">Other — enter postgraduate name</option></select></label><label id="otherPgWrap" class="wide hide">Enter postgraduate name *<input id="otherPg" maxlength="120"></label><label class="wide">Diagnosis *<textarea name="diagnosis" required maxlength="1500"></textarea></label><label class="wide">Dressing / Procedure *<select id="procedure" name="procedure_name" required><option value="">Select procedure</option><option>I&D</option><option>Saline dressing</option><option>Wound debridement</option><option>Suture removal</option><option>Suturing</option><option>Glue application</option><option>Intralesional steroid injection</option><option>Foreign body removal</option><option>Ray amputation</option><option value="__other__">Other — specify</option></select></label><label id="otherProcedureWrap" class="wide hide">Other procedure *<input id="otherProcedure" maxlength="1500"></label><div class="wide"><div class="bar"><button id="save" type="submit">Save dressing entry</button><button class="secondary" type="reset">Clear</button></div><div id="result" class="notice" role="status"></div></div></form></section></div></main><script>
const $=id=>document.getElementById(id);
const endpoint='https://dtbpchspeirxvojfozld.supabase.co/functions/v1/dressing-room-submit';
const pg=$('pg');const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadPG(){try{const res=await fetch(endpoint);if(!res.ok)throw Error('Unavailable');const data=await res.json();pg.innerHTML='<option value="">Select postgraduate</option>'+(data.names||[]).map(n=>'<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>').join('')+'<option value="__other__">Other — enter postgraduate name</option>'}catch(e){console.warn('PG roster not available',e)}}loadPG();pg.addEventListener('change',()=>{const other=pg.value==='__other__';$('otherPgWrap').classList.toggle('hide',!other);$('otherPg').required=other});
$('procedure').addEventListener('change',()=>{let other=$('procedure').value==='__other__';$('otherProcedureWrap').classList.toggle('hide',!other);$('otherProcedure').required=other});
$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const fd=new FormData(e.target),pgname=pg.value==='__other__'?$('otherPg').value.trim():pg.value.trim();
 if(!pgname){$('result').textContent='Please enter the postgraduate name.';return}const procedure=$('procedure').value==='__other__'?$('otherProcedure').value.trim():$('procedure').value;if(!procedure){$('result').textContent='Please specify the procedure.';return}
 const payload={patient_name:String(fd.get('patient_name')).trim(),age:Number(fd.get('age')),sex:fd.get('sex'),unit:fd.get('unit'),ward:fd.get('ward'),pg_name:pgname,diagnosis:String(fd.get('diagnosis')).trim(),procedure_name:procedure,website:''};
 $('save').disabled=true;$('result').textContent='Saving…';
 try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Save failed');$('result').className='notice ok';$('result').textContent='Entry saved successfully · '+data.entry_date+' · '+data.entry_time;e.target.reset();$('otherProcedureWrap').classList.add('hide');$('otherPgWrap').classList.add('hide')}
 catch(err){$('result').className='notice error';$('result').textContent='Not saved: '+err.message}
 finally{$('save').disabled=false}
});
</script></body></html>
